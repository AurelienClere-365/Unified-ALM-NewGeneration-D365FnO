# =============================================================================
# Dynamics 365 Commerce - e-Commerce extension
# Single CI/CD pipeline: build + deployment to UAT / PROD in one YAML file
#
# Branches
#   feature/* , bugfix/* , personal branches -> nothing is triggered
#   uat   (commit or merged PR)               -> Build + deploy to UAT
#   main  (commit or merged PR from uat)      -> Build + deploy to PROD
#
# PR validation (Branch Policy "Build validation" on uat and main)
#   PR -> uat  : build only, no deployment
#   PR -> main : build only + guard: the source branch MUST be uat
#
# Run name: CONTOSO eCommerce <branch> <date>.<n>   e.g. CONTOSO eCommerce uat 20261021.1
#   Replace CONTOSO with your own prefix (here and in buildPrefix).
#
# Environments: this template has 1 UAT + 1 PROD. Add or remove environments
# as needed (see "Adapt the environments" in the root README).
#
# >>> Everything you need to adapt is in the CONFIGURATION section below <<<
# =============================================================================

name: CONTOSO eCommerce $(Build.SourceBranchName) $(Date:yyyyMMdd)$(Rev:.r)

# Branch names in the trigger cannot be variables (Azure DevOps limitation).
# If you rename uat or main, change them here AND in uatBranch / prodBranch below.
trigger:
  batch: true
  branches:
    include:
      - uat
      - main
  # If the e-Commerce and CSU code live in the same repository, uncomment:
  # paths:
  #   include:
  #     - src/ECommerce/*   # <-- folder of the e-Commerce code

# Ignored by Azure Repos: PR builds come from the Branch Policy
pr: none

parameters:
  - name: deploymentMode
    displayName: 'Deployment mode'
    type: string
    default: LCS
    values:
      - LCS
      - Dataverse

pool:
  vmImage: 'windows-latest'

variables:
  # ===========================================================================
  # CONFIGURATION
  # ===========================================================================

  # --- General ---
  - name: buildPrefix
    value: 'CONTOSO eCommerce'                # <-- your prefix
  - name: nodeVersion
    value: '24.x'
  - name: artifactName
    value: 'drop'

  # --- LCS (shared) ---
  - name: lcsServiceConnection
    value: 'LCS-ServiceConnection'          # <-- name of your LCS service connection in Azure DevOps
  - name: lcsProjectId
    value: '0000000'                        # <-- your LCS project ID (end of the project dashboard URL)
  - name: lcsAssetType
    value: '26'                             # LCS asset type code: 26 = e-Commerce package
  - name: lcsDeploymentType
    value: 'ecom'                           # LCS deployment type: ecom = e-Commerce package

  # --- UAT ---
  - name: uatBranch
    value: 'refs/heads/uat'
  - name: uatLcsEnvironmentId
    value: '00000000-0000-0000-0000-000000000000'   # <-- UAT environment GUID (LCS > Environment details)
  - name: uatEcommerceName
    value: '<UAT_ECOMMERCE_NAME>'           # <-- LCS > environment > Manage > Commerce > e-Commerce
  - name: uatAdoEnvironment
    value: 'eCommerce-UAT'                  # Azure DevOps Environment (Pipelines > Environments)
  - name: uatDataverseVariableGroup
    value: 'Commerce-ECommerce-UAT'         # Dataverse mode only

  # --- PROD ---
  - name: prodBranch
    value: 'refs/heads/main'
  - name: prodLcsEnvironmentId
    value: '00000000-0000-0000-0000-000000000000'   # <-- PROD environment GUID
  - name: prodEcommerceName
    value: '<PROD_ECOMMERCE_NAME>'
  - name: prodAdoEnvironment
    value: 'eCommerce-PROD'                 # put the manual approval on this Environment
  - name: prodDataverseVariableGroup
    value: 'Commerce-ECommerce-PROD'        # Dataverse mode only

  # ===========================================================================
  # END OF CONFIGURATION
  # ===========================================================================
  - name: packageFileName
    value: 'Msdyn365.Commerce.Online_$(Build.SourceBranchName)_$(Build.BuildId).zip'

stages:
# -----------------------------------------------------------------------------
# BUILD: uat, main and PR validation
# -----------------------------------------------------------------------------
  - stage: Build
    displayName: 'Build e-Commerce package'
    jobs:
      - job: Build
        displayName: 'Build and pack'
        steps:
          - checkout: self
            clean: true

          - task: PowerShell@2
            displayName: 'PR guard: main <- uat only'
            condition: and(eq(variables['Build.Reason'], 'PullRequest'), eq(variables['System.PullRequest.TargetBranch'], variables['prodBranch']))
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                $source = '$(System.PullRequest.SourceBranch)'
                if ($source -ne '$(uatBranch)') {
                    Write-Host "##vso[task.logissue type=error]A PR into $(prodBranch) must come from $(uatBranch). Source branch: $source"
                    exit 1
                }
                Write-Host "Source branch OK: $source"

          - task: NodeTool@0
            displayName: 'Use Node.js $(nodeVersion)'
            inputs:
              versionSpec: $(nodeVersion)

          - task: PowerShell@2
            displayName: 'Install Yarn'
            inputs:
              targetType: 'inline'
              script: npm install -g yarn

          - task: PowerShell@2
            displayName: 'Install dependencies'
            inputs:
              targetType: 'inline'
              script: yarn install --frozen-lockfile
              workingDirectory: '$(Build.SourcesDirectory)'

          - task: PowerShell@2
            displayName: 'Build application'
            inputs:
              targetType: 'inline'
              script: yarn build
              workingDirectory: '$(Build.SourcesDirectory)'

          - task: PowerShell@2
            displayName: 'Pack e-Commerce application'
            inputs:
              targetType: 'inline'
              script: yarn msdyn365 pack
              workingDirectory: '$(Build.SourcesDirectory)'

          - task: PowerShell@2
            displayName: 'Copy package to artifact staging directory'
            inputs:
              targetType: filePath
              filePath: ./Pipeline/PowerShellScripts/CopyFileToDestination.ps1
              arguments: '-RelativePath "$(Build.SourcesDirectory)" -File "Msdyn365.Commerce.Online-*.zip" -DestinationFullName "$(Build.ArtifactStagingDirectory)\$(packageFileName)"'
              failOnStderr: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publish artifact $(artifactName)'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: '$(artifactName)'
              publishLocation: 'pipeline'

# -----------------------------------------------------------------------------
# DEPLOY: one stage per environment, values read from CONFIGURATION
#   UAT  : only on a commit/merge into uatBranch
#   PROD : only on a commit/merge into prodBranch
#   Never on a PR
# -----------------------------------------------------------------------------
  # ----- UAT -----
  - stage: Deploy_UAT
    displayName: 'Deploy to UAT'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], variables['uatBranch']), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - name: envLabel
        value: 'UAT'
      - ${{ if eq(parameters.deploymentMode, 'Dataverse') }}:
        - group: ${{ variables.uatDataverseVariableGroup }}
    jobs:
      - deployment: Deploy_UAT
        displayName: 'Deploy e-Commerce package to UAT'
        environment: ${{ variables.uatAdoEnvironment }}
        timeoutInMinutes: 180
        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs do not check out the repo by default (needed for the Dataverse scripts)
                - checkout: self
                  clean: true

                - download: current
                  artifact: $(artifactName)
                  displayName: 'Download package'

                - task: PowerShell@2
                  displayName: 'Locate package'
                  inputs:
                    targetType: 'inline'
                    pwsh: true
                    script: |
                      $ErrorActionPreference = 'Stop'
                      $pkg = Get-ChildItem "$(Pipeline.Workspace)/$(artifactName)/Msdyn365.Commerce.Online_*.zip" | Select-Object -First 1
                      if (-not $pkg) { throw "No package found in the artifact" }
                      Write-Host "Package: $($pkg.FullName)"
                      Write-Host "##vso[task.setvariable variable=PackagePath]$($pkg.FullName)"

                # ----- LCS mode (current) -----
                - ${{ if eq(parameters.deploymentMode, 'LCS') }}:
                  - task: LCSAssetUpload@2
                    name: lcsUpload
                    displayName: 'Upload $(buildPrefix) $(envLabel) - build $(Build.BuildNumber)'
                    inputs:
                      serviceConnectionName: '${{ variables.lcsServiceConnection }}'
                      projectId: '$(lcsProjectId)'
                      assetType: '$(lcsAssetType)'
                      assetPath: '$(PackagePath)'
                      assetName: '$(Build.BuildNumber) $(envLabel)'
                      assetDescription: '$(buildPrefix) $(envLabel) - $(Build.SourceBranchName) - $(Build.SourceVersion)'
                      waitForValidation: true

                  - task: LCSAssetDeploy@4
                    displayName: 'Deploy to environment $(envLabel)'
                    inputs:
                      serviceConnectionName: '${{ variables.lcsServiceConnection }}'
                      projectId: '$(lcsProjectId)'
                      environmentId: '$(uatLcsEnvironmentId)'
                      fileAssetId: '$(lcsUpload.FileAssetId)'
                      deploymentType: '$(lcsDeploymentType)'
                      ecommerceEnvironmentId: '$(uatEcommerceName)'
                      releaseName: '$(buildPrefix) $(envLabel) - $(Build.BuildNumber)'
                      waitForCompletion: true

                # ----- Dataverse mode (later) -----
                - ${{ if eq(parameters.deploymentMode, 'Dataverse') }}:
                  - task: PowerShell@2
                    displayName: 'Upload package to Dataverse ($(envLabel))'
                    inputs:
                      targetType: 'inline'
                      pwsh: true
                      script: |
                        $ErrorActionPreference = 'Stop'

                        $uploadParams = @{
                            PackageFilePath  = '$(PackagePath)'
                            PackagePublisher = '$(PackagePublisher)'
                            EnvironmentUrl   = '$(DataverseUrl)'
                            TenantId         = '$(TenantId)'
                            ClientId         = '$(ClientId)'
                            ClientSecret     = $env:CLIENT_SECRET
                            ValidationStatus = 'Valid'
                        }

                        if ('$(PackageName)' -and '$(PackageName)' -notlike '*PackageName*') {
                            $uploadParams.PackageName = '$(PackageName)'
                        }

                        & "$(Build.SourcesDirectory)/Pipeline/PowerShellScripts/DataverseClient/UploadExtensionPackage.ps1" @uploadParams
                    env:
                      CLIENT_SECRET: $(ClientSecret)

  # ----- PROD -----
  - stage: Deploy_PROD
    displayName: 'Deploy to PROD'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], variables['prodBranch']), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - name: envLabel
        value: 'PROD'
      - ${{ if eq(parameters.deploymentMode, 'Dataverse') }}:
        - group: ${{ variables.prodDataverseVariableGroup }}
    jobs:
      - deployment: Deploy_PROD
        displayName: 'Deploy e-Commerce package to PROD'
        environment: ${{ variables.prodAdoEnvironment }}
        timeoutInMinutes: 180
        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs do not check out the repo by default (needed for the Dataverse scripts)
                - checkout: self
                  clean: true

                - download: current
                  artifact: $(artifactName)
                  displayName: 'Download package'

                - task: PowerShell@2
                  displayName: 'Locate package'
                  inputs:
                    targetType: 'inline'
                    pwsh: true
                    script: |
                      $ErrorActionPreference = 'Stop'
                      $pkg = Get-ChildItem "$(Pipeline.Workspace)/$(artifactName)/Msdyn365.Commerce.Online_*.zip" | Select-Object -First 1
                      if (-not $pkg) { throw "No package found in the artifact" }
                      Write-Host "Package: $($pkg.FullName)"
                      Write-Host "##vso[task.setvariable variable=PackagePath]$($pkg.FullName)"

                # ----- LCS mode (current) -----
                - ${{ if eq(parameters.deploymentMode, 'LCS') }}:
                  - task: LCSAssetUpload@2
                    name: lcsUpload
                    displayName: 'Upload $(buildPrefix) $(envLabel) - build $(Build.BuildNumber)'
                    inputs:
                      serviceConnectionName: '${{ variables.lcsServiceConnection }}'
                      projectId: '$(lcsProjectId)'
                      assetType: '$(lcsAssetType)'
                      assetPath: '$(PackagePath)'
                      assetName: '$(Build.BuildNumber) $(envLabel)'
                      assetDescription: '$(buildPrefix) $(envLabel) - $(Build.SourceBranchName) - $(Build.SourceVersion)'
                      waitForValidation: true

                  - task: LCSAssetDeploy@4
                    displayName: 'Deploy to environment $(envLabel)'
                    inputs:
                      serviceConnectionName: '${{ variables.lcsServiceConnection }}'
                      projectId: '$(lcsProjectId)'
                      environmentId: '$(prodLcsEnvironmentId)'
                      fileAssetId: '$(lcsUpload.FileAssetId)'
                      deploymentType: '$(lcsDeploymentType)'
                      ecommerceEnvironmentId: '$(prodEcommerceName)'
                      releaseName: '$(buildPrefix) $(envLabel) - $(Build.BuildNumber)'
                      waitForCompletion: true

                # ----- Dataverse mode (later) -----
                - ${{ if eq(parameters.deploymentMode, 'Dataverse') }}:
                  - task: PowerShell@2
                    displayName: 'Upload package to Dataverse ($(envLabel))'
                    inputs:
                      targetType: 'inline'
                      pwsh: true
                      script: |
                        $ErrorActionPreference = 'Stop'

                        $uploadParams = @{
                            PackageFilePath  = '$(PackagePath)'
                            PackagePublisher = '$(PackagePublisher)'
                            EnvironmentUrl   = '$(DataverseUrl)'
                            TenantId         = '$(TenantId)'
                            ClientId         = '$(ClientId)'
                            ClientSecret     = $env:CLIENT_SECRET
                            ValidationStatus = 'Valid'
                        }

                        if ('$(PackageName)' -and '$(PackageName)' -notlike '*PackageName*') {
                            $uploadParams.PackageName = '$(PackageName)'
                        }

                        & "$(Build.SourcesDirectory)/Pipeline/PowerShellScripts/DataverseClient/UploadExtensionPackage.ps1" @uploadParams
                    env:
                      CLIENT_SECRET: $(ClientSecret)
