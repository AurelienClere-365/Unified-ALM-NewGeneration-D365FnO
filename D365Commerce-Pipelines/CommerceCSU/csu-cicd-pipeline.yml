# =============================================================================
# Dynamics 365 Commerce - Commerce Scale Unit (CSU) extension
# Single CI/CD pipeline: build + deployment to UAT / PROD in one YAML file
# Deployment mode: LCS (default) or Dataverse (selected when running manually)
#
# Based on the Microsoft sample repository Dynamics365Commerce.ScaleUnit
# (independent packaging model, Commerce SDK 10.0.19 and later).
# The build produces CloudScaleUnitExtensionPackage.zip (CRT, Headless Commerce
# APIs, channel database scripts, payment connector, Store Commerce for web).
#
# Branches
#   feature/* , bugfix/* , personal branches -> nothing is triggered
#   uat   (commit or merged PR)               -> Build + deploy to UAT CSU
#   main  (commit or merged PR from uat)      -> Build + deploy to PROD CSU
#
# PR validation (Branch Policy "Build validation" on uat and main)
#   PR -> uat  : build only, no deployment
#   PR -> main : build only + guard: the source branch MUST be uat
#
# Run name: CONTOSO CSU <branch> <date>.<n>   e.g. CONTOSO CSU uat 20261021.1
#   Replace CONTOSO with your own prefix (here and in buildPrefix).
#
# Environments: this template has 1 UAT + 1 PROD. Add or remove environments
# as needed (see "Adapt the environments" in the root README).
#
# >>> Everything you need to adapt is in the CONFIGURATION section below <<<
# =============================================================================

name: CONTOSO CSU $(Build.SourceBranchName) $(Date:yyyyMMdd)$(Rev:.r)

# Branch names in the trigger cannot be variables (Azure DevOps limitation).
# If you rename uat or main, change them here AND in uatBranch / prodBranch below.
trigger:
  batch: true
  branches:
    include:
      - uat
      - main
  # If the CSU and e-Commerce code live in the same repository, uncomment:
  # paths:
  #   include:
  #     - src/ScaleUnit/*   # <-- folder of the CSU code

# Ignored by Azure Repos: PR builds come from the Branch Policy
pr: none

parameters:
  - name: deploymentMode
    displayName: 'Deployment mode'
    type: string
    default: LCS
    values:
      - LCS
      - Dataverse

pool:
  vmImage: 'windows-latest'     # VSBuild needs a Windows agent with Visual Studio

variables:
  # ===========================================================================
  # CONFIGURATION
  # ===========================================================================

  # --- General ---
  - name: buildPrefix
    value: 'CONTOSO CSU'                      # <-- your prefix
  - name: artifactName
    value: 'drop'
  - name: solution
    value: '**\*.sln'                       # solution that contains the extension + packaging projects
  - name: buildConfiguration
    value: 'Release'
  - name: nugetConfigPath
    value: 'nuget.config'                   # must reference the dynamics365-commerce public feed
  - name: csuPackageSearchPath
    value: '$(Build.SourcesDirectory)\src\ScaleUnitSample'   # <-- folder of your ScaleUnit packaging project
  - name: csuPackageFile
    value: 'CloudScaleUnitExtensionPackage.zip'

  # --- LCS (shared) ---
  - name: lcsServiceConnection
    value: 'LCS-ServiceConnection'          # <-- name of your LCS service connection in Azure DevOps
  - name: lcsProjectId
    value: '0000000'                        # <-- your LCS project ID (end of the project dashboard URL)
  - name: lcsAssetType
    value: '29'                             # LCS asset type code: 29 = Commerce Cloud Scale Unit Extension
  - name: lcsDeploymentType
    value: 'csu'                            # LCS deployment type: csu = Commerce Cloud Scale Unit Extension

  # --- UAT ---
  - name: uatBranch
    value: 'refs/heads/uat'
  - name: uatLcsEnvironmentId
    value: '00000000-0000-0000-0000-000000000000'   # <-- UAT environment GUID (LCS > Environment details)
  - name: uatCsuName
    value: '<UAT_CSU_NAME>'                 # <-- LCS > environment > Manage > Commerce > Commerce Scale Units
  - name: uatAdoEnvironment
    value: 'CSU-UAT'                        # Azure DevOps Environment (Pipelines > Environments)
  - name: uatDataverseVariableGroup
    value: 'Commerce-CSU-UAT'               # Dataverse mode only

  # --- PROD ---
  - name: prodBranch
    value: 'refs/heads/main'
  - name: prodLcsEnvironmentId
    value: '00000000-0000-0000-0000-000000000000'   # <-- PROD environment GUID
  - name: prodCsuName
    value: '<PROD_CSU_NAME>'
  - name: prodAdoEnvironment
    value: 'CSU-PROD'                       # put the manual approval on this Environment
  - name: prodDataverseVariableGroup
    value: 'Commerce-CSU-PROD'              # Dataverse mode only

  # --- Dataverse mode only ---
  - name: dataverseUploadScript
    value: 'Pipeline/PowerShellScripts/DataverseClient/UploadCsuExtensionPackage.ps1'   # see the CSU README
  - name: dataversePackageName
    value: 'Contoso.Commerce.ScaleUnit'     # <-- package name shown in Dataverse
  - name: dataversePackageVersion
    value: '1.0.$(Build.BuildId)'           # package version shown in Dataverse

  # ===========================================================================
  # END OF CONFIGURATION
  # ===========================================================================
  - name: packageFileName
    value: 'ScaleUnitPackage_$(Build.SourceBranchName)_$(Build.BuildId).zip'

stages:
# -----------------------------------------------------------------------------
# BUILD: uat, main and PR validation
# -----------------------------------------------------------------------------
  - stage: Build
    displayName: 'Build CSU extension package'
    jobs:
      - job: Build
        displayName: 'Build and package'
        steps:
          - checkout: self
            clean: true

          - task: PowerShell@2
            displayName: 'PR guard: main <- uat only'
            condition: and(eq(variables['Build.Reason'], 'PullRequest'), eq(variables['System.PullRequest.TargetBranch'], variables['prodBranch']))
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                $source = '$(System.PullRequest.SourceBranch)'
                if ($source -ne '$(uatBranch)') {
                    Write-Host "##vso[task.logissue type=error]A PR into $(prodBranch) must come from $(uatBranch). Source branch: $source"
                    exit 1
                }
                Write-Host "Source branch OK: $source"

          # Script from the Dynamics365Commerce.ScaleUnit sample repo (Pipeline/PowerShellScripts)
          - task: PowerShell@2
            displayName: 'Pre-build steps'
            inputs:
              targetType: filePath
              filePath: ./Pipeline/PowerShellScripts/Pre-Build.ps1
              failOnStderr: true

          - task: NuGetToolInstaller@1
            displayName: 'Install NuGet'

          - task: NuGetCommand@2
            displayName: 'NuGet restore'
            inputs:
              command: 'restore'
              restoreSolution: '$(solution)'
              feedsToUse: 'config'
              nugetConfigPath: '$(nugetConfigPath)'

          - task: VSBuild@1
            displayName: 'Build solution $(solution)'
            inputs:
              solution: '$(solution)'
              configuration: '$(buildConfiguration)'
              clean: true

          - task: PowerShell@2
            displayName: 'Copy CSU package to artifact staging directory'
            inputs:
              targetType: filePath
              filePath: ./Pipeline/PowerShellScripts/CopyFileToDestination.ps1
              arguments: '-RelativePath "$(csuPackageSearchPath)" -File "$(csuPackageFile)" -DestinationFullName "$(Build.ArtifactStagingDirectory)\$(packageFileName)"'
              failOnStderr: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publish artifact $(artifactName)'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: '$(artifactName)'
              publishLocation: 'pipeline'

# -----------------------------------------------------------------------------
# DEPLOY: one stage per environment, values read from CONFIGURATION
#   UAT  : only on a commit/merge into uatBranch
#   PROD : only on a commit/merge into prodBranch
#   Never on a PR
# -----------------------------------------------------------------------------
  # ----- UAT -----
  - stage: Deploy_UAT
    displayName: 'Deploy to UAT'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], variables['uatBranch']), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - name: envLabel
        value: 'UAT'
      - ${{ if eq(parameters.deploymentMode, 'Dataverse') }}:
        - group: ${{ variables.uatDataverseVariableGroup }}
    jobs:
      - deployment: Deploy_UAT
        displayName: 'Deploy CSU extension to UAT'
        environment: ${{ variables.uatAdoEnvironment }}
        timeoutInMinutes: 360          # LCS validation + CSU servicing can take several hours
        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs do not check out the repo by default (needed for the Dataverse script)
                - checkout: self
                  clean: true

                - download: current
                  artifact: $(artifactName)
                  displayName: 'Download package'

                - task: PowerShell@2
                  displayName: 'Locate package'
                  inputs:
                    targetType: 'inline'
                    pwsh: true
                    script: |
                      $ErrorActionPreference = 'Stop'
                      $pkg = Get-ChildItem "$(Pipeline.Workspace)/$(artifactName)/ScaleUnitPackage_*.zip" | Select-Object -First 1
                      if (-not $pkg) { throw "No package found in the artifact" }
                      Write-Host "Package: $($pkg.FullName)"
                      Write-Host "##vso[task.setvariable variable=PackagePath]$($pkg.FullName)"

                # ----- LCS mode -----
                - ${{ if eq(parameters.deploymentMode, 'LCS') }}:
                  - task: LCSAssetUpload@2
                    name: lcsUpload
                    displayName: 'Upload $(buildPrefix) $(envLabel) - build $(Build.BuildNumber)'
                    inputs:
                      serviceConnectionName: '${{ variables.lcsServiceConnection }}'
                      projectId: '$(lcsProjectId)'
                      assetType: '$(lcsAssetType)'
                      assetPath: '$(PackagePath)'
                      assetName: '$(Build.BuildNumber) $(envLabel)'
                      assetDescription: '$(buildPrefix) $(envLabel) - $(Build.SourceBranchName) - $(Build.SourceVersion)'
                      waitForValidation: true

                  - task: LCSAssetDeploy@4
                    displayName: 'Deploy to environment $(envLabel)'
                    inputs:
                      serviceConnectionName: '${{ variables.lcsServiceConnection }}'
                      projectId: '$(lcsProjectId)'
                      environmentId: '$(uatLcsEnvironmentId)'
                      fileAssetId: '$(lcsUpload.FileAssetId)'
                      deploymentType: '$(lcsDeploymentType)'
                      csuName: '$(uatCsuName)'                                 # check with the task assistant (see README)
                      releaseName: '$(buildPrefix) $(envLabel) - $(Build.BuildNumber)'
                      waitForCompletion: true

                # ----- Dataverse mode -----
                - ${{ if eq(parameters.deploymentMode, 'Dataverse') }}:
                  - task: PowerShell@2
                    displayName: 'Upload CSU package to Dataverse ($(envLabel))'
                    inputs:
                      targetType: 'inline'
                      pwsh: true
                      script: |
                        $ErrorActionPreference = 'Stop'

                        # Rename the package as <Name>-<Version>.zip so that the upload script can read name and version
                        $target = Join-Path '$(Agent.TempDirectory)' ('$(dataversePackageName)-$(dataversePackageVersion).zip')
                        Copy-Item '$(PackagePath)' $target -Force
                        Write-Host "Dataverse package: $target"

                        $uploadParams = @{
                            PackageFilePath  = $target
                            PackageName      = '$(dataversePackageName)'
                            PackagePublisher = '$(PackagePublisher)'
                            EnvironmentUrl   = '$(DataverseUrl)'
                            TenantId         = '$(TenantId)'
                            ClientId         = '$(ClientId)'
                            ClientSecret     = $env:CLIENT_SECRET
                            ValidationStatus = 'Valid'
                        }

                        & "$(Build.SourcesDirectory)/$(dataverseUploadScript)" @uploadParams
                    env:
                      CLIENT_SECRET: $(ClientSecret)

  # ----- PROD -----
  - stage: Deploy_PROD
    displayName: 'Deploy to PROD'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], variables['prodBranch']), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - name: envLabel
        value: 'PROD'
      - ${{ if eq(parameters.deploymentMode, 'Dataverse') }}:
        - group: ${{ variables.prodDataverseVariableGroup }}
    jobs:
      - deployment: Deploy_PROD
        displayName: 'Deploy CSU extension to PROD'
        environment: ${{ variables.prodAdoEnvironment }}
        timeoutInMinutes: 360          # LCS validation + CSU servicing can take several hours
        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs do not check out the repo by default (needed for the Dataverse script)
                - checkout: self
                  clean: true

                - download: current
                  artifact: $(artifactName)
                  displayName: 'Download package'

                - task: PowerShell@2
                  displayName: 'Locate package'
                  inputs:
                    targetType: 'inline'
                    pwsh: true
                    script: |
                      $ErrorActionPreference = 'Stop'
                      $pkg = Get-ChildItem "$(Pipeline.Workspace)/$(artifactName)/ScaleUnitPackage_*.zip" | Select-Object -First 1
                      if (-not $pkg) { throw "No package found in the artifact" }
                      Write-Host "Package: $($pkg.FullName)"
                      Write-Host "##vso[task.setvariable variable=PackagePath]$($pkg.FullName)"

                # ----- LCS mode -----
                - ${{ if eq(parameters.deploymentMode, 'LCS') }}:
                  - task: LCSAssetUpload@2
                    name: lcsUpload
                    displayName: 'Upload $(buildPrefix) $(envLabel) - build $(Build.BuildNumber)'
                    inputs:
                      serviceConnectionName: '${{ variables.lcsServiceConnection }}'
                      projectId: '$(lcsProjectId)'
                      assetType: '$(lcsAssetType)'
                      assetPath: '$(PackagePath)'
                      assetName: '$(Build.BuildNumber) $(envLabel)'
                      assetDescription: '$(buildPrefix) $(envLabel) - $(Build.SourceBranchName) - $(Build.SourceVersion)'
                      waitForValidation: true

                  - task: LCSAssetDeploy@4
                    displayName: 'Deploy to environment $(envLabel)'
                    inputs:
                      serviceConnectionName: '${{ variables.lcsServiceConnection }}'
                      projectId: '$(lcsProjectId)'
                      environmentId: '$(prodLcsEnvironmentId)'
                      fileAssetId: '$(lcsUpload.FileAssetId)'
                      deploymentType: '$(lcsDeploymentType)'
                      csuName: '$(prodCsuName)'                                 # check with the task assistant (see README)
                      releaseName: '$(buildPrefix) $(envLabel) - $(Build.BuildNumber)'
                      waitForCompletion: true

                # ----- Dataverse mode -----
                - ${{ if eq(parameters.deploymentMode, 'Dataverse') }}:
                  - task: PowerShell@2
                    displayName: 'Upload CSU package to Dataverse ($(envLabel))'
                    inputs:
                      targetType: 'inline'
                      pwsh: true
                      script: |
                        $ErrorActionPreference = 'Stop'

                        # Rename the package as <Name>-<Version>.zip so that the upload script can read name and version
                        $target = Join-Path '$(Agent.TempDirectory)' ('$(dataversePackageName)-$(dataversePackageVersion).zip')
                        Copy-Item '$(PackagePath)' $target -Force
                        Write-Host "Dataverse package: $target"

                        $uploadParams = @{
                            PackageFilePath  = $target
                            PackageName      = '$(dataversePackageName)'
                            PackagePublisher = '$(PackagePublisher)'
                            EnvironmentUrl   = '$(DataverseUrl)'
                            TenantId         = '$(TenantId)'
                            ClientId         = '$(ClientId)'
                            ClientSecret     = $env:CLIENT_SECRET
                            ValidationStatus = 'Valid'
                        }

                        & "$(Build.SourcesDirectory)/$(dataverseUploadScript)" @uploadParams
                    env:
                      CLIENT_SECRET: $(ClientSecret)
