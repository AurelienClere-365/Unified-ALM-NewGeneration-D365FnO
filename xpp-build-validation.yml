name: $(Date:yy.MM.dd)$(Rev:.r)

trigger:
  - none

# 🔒 Global pool — applies to ALL stages and jobs 
pool: 
  vmImage: 'windows-latest'


variables:
  App1Package: 'Microsoft.Dynamics.AX.Application1.DevALM.BuildXpp'
  App2Package: 'Microsoft.Dynamics.AX.Application2.DevALM.BuildXpp'
  AppSuitePackage: 'Microsoft.Dynamics.AX.ApplicationSuite.DevALM.BuildXpp'
  PlatPackage: 'Microsoft.Dynamics.AX.Platform.DevALM.BuildXpp'
  ToolsPackage: 'Microsoft.Dynamics.AX.Platform.CompilerPackage'
  MetadataPath: '$(Build.SourcesDirectory)\Metadata'
  NugetConfigsPath: '$(Build.SourcesDirectory)\Tools\Build'
  NugetsPath: '$(Pipeline.Workspace)\NuGets'

stages:
# ---------- Stage 1: Build ----------
- stage: Build
  displayName: X++ Build & Package
  jobs:
  - job: BuildXpp
    displayName: Build solution and create deployable package
    
    steps:
      # Install NuGet and use -ExcludeVersion option
      - task: NuGetCommand@2
        displayName: 'NuGet custom install Packages'
        inputs:
          command: custom
          arguments: 'install -Noninteractive $(NugetConfigsPath)\packages.config -ConfigFile $(NugetConfigsPath)\nuget.config -Verbosity Detailed -ExcludeVersion -OutputDirectory "$(NugetsPath)"'

      # Read the platform and application versions from packages.config, so the unified
      # package is stamped with the versions that were restored (one place to update)
      - task: PowerShell@2
        displayName: 'Read package versions from packages.config'
        inputs:
          targetType: 'inline'
          script: |
            [xml]$config = Get-Content "$(NugetConfigsPath)\packages.config"
            $platform = ($config.packages.package | Where-Object id -eq '$(PlatPackage)').version
            $application = ($config.packages.package | Where-Object id -eq '$(AppSuitePackage)').version
            if (-not $platform -or -not $application) {
              Write-Error "packages.config must list $(PlatPackage) and $(AppSuitePackage)"
              exit 1
            }
            Write-Host "Platform version: $platform / Application version: $application"
            Write-Host "##vso[task.setvariable variable=PlatformVersion]$platform"
            Write-Host "##vso[task.setvariable variable=ApplicationVersion]$application"

      # Use the custom build number y.m.d.rev as the model version
      - task: XppUpdateModelVersion@0
        displayName: 'Update Model Version'
        inputs:
          XppSourcePath: '$(MetadataPath)'
          VersionNumber: '$(Build.BuildNumber)'
          XppLayer: 14

      # Build using MSBuild 17 (VS 2022)
      - task: VSBuild@1
        displayName: 'Build Project.sln'
        inputs:
          solution: 'Projects/DevProject/DevProject.sln'
          vsVersion: '17.0'
          msbuildArgs: >
            /p:BuildTasksDirectory="$(NugetsPath)\$(ToolsPackage)\DevAlm"
            /p:MetadataDirectory="$(MetadataPath)"
            /p:FrameworkDirectory="$(NuGetsPath)\$(ToolsPackage)"
            /p:ReferenceFolder="$(NuGetsPath)\$(PlatPackage)\ref\net40;$(NuGetsPath)\$(App1Package)\ref\net40;$(NuGetsPath)\$(App2Package)\ref\net40;$(NuGetsPath)\$(AppSuitePackage)\ref\net40;$(MetadataPath);$(Build.BinariesDirectory)"
            /p:ReferencePath="$(NuGetsPath)\$(ToolsPackage)"
            /p:OutputDirectory="$(Build.BinariesDirectory)"

      # Copy compiler log files to drop
      - task: CopyFiles@2
        displayName: 'Copy X++ Compile Log Files to: $(Build.ArtifactStagingDirectory)\Logs'
        inputs:
          SourceFolder: '$(Build.SourcesDirectory)'
          Contents: |
            **\Dynamics.AX.*.xppc.*
            **\Dynamics.AX.*.labelc.*
            **\Dynamics.AX.*.reportsc.*
          TargetFolder: '$(Build.ArtifactStagingDirectory)\Logs'
        condition: succeededOrFailed()

      # For packaging we need NuGet < 3.4.0
      - task: NuGetToolInstaller@0
        displayName: 'Use NuGet 3.3.0'
        inputs:
          versionSpec: 3.3.0

      - task: XppCreatePackage@3
        displayName: Create Deployable Package
        inputs:
          XppToolsPath: '$(NuGetsPath)\$(ToolsPackage)'
          XppBinariesPath: '$(Build.BinariesDirectory)'
          CreateCloudPackage: true
          CloudPackagePlatVersion: '$(PlatformVersion)'
          CloudPackageAppVersion: '$(ApplicationVersion)'
          CloudPackageOutputLocation: '$(Build.ArtifactStagingDirectory)\CloudDeployablePackage_$(Build.BuildNumber)'
          CreateRegularPackage: true
          DeployablePackagePath: '$(Build.ArtifactStagingDirectory)\AXDeployableRuntime_$(Build.BuildNumber).zip'

      # Enable to add license file to the package
      - task: XppAddLicenseToPackage@1
        displayName: 'Add Licenses to Deployable Package'
        enabled: false

      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: drop'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        condition: succeededOrFailed()